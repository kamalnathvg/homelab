apiVersion: v1
kind: PersistentVolume
metadata:
  name: media
spec:
  capacity:
    storage: 1500Gi   # arbitrary — CSI NFS ignores actual capacity, just needs to be non-zero
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.1    # Use NFS v4.1 for better performance and security
    - hard           # Retry indefinitely on failure (safe for data integrity)
    - noatime        # Don't update access times (reduces NAS I/O)
    - rw
    - noexec
    - nosuid
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: media
    volumeAttributes:
      server: 10.0.0.231
      share: /mnt/kadal/media

---

