# overlays/dev/imageupdateautomation.yaml
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: chandiroor-release
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: homelab              # the infra repo, NOT tvm-dev
  git:
    checkout:
      ref:
        branch: main            # infra repo branch
    commit:
      author:
        email: kamalnath7171@gmail.com
        name: fluxcdbot
      messageTemplate: 'chore: update chandiroor-release image to {{range .Updated.Images}}{{println .}}{{end}}'
    push:
      branch: main
  update:
    path: ./cluster/production/chandiroor/overlays/release
    strategy: Setters
