apiVersion: v1
kind: PersistentVolume
metadata:
  name: navidrome-data-pv
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1    # Use NFS v4.1 for better performance and security
    - hard           # Retry indefinitely on failure (safe for data integrity)
    - noatime        # Don't update access times (reduces NAS I/O)
  nfs:
    server: 10.0.0.231       # Your NAS IP address
    path: /mnt/kadal/apps/navidrome
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: navidrome-music-pv
spec:
  capacity:
    storage: 100Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1    # Use NFS v4.1 for better performance and security
    - hard           # Retry indefinitely on failure (safe for data integrity)
    - noatime        # Don't update access times (reduces NAS I/O)
  nfs:
    server: 10.0.0.231       # Your NAS IP address
    path: /mnt/kadal/nextcloud/kamalnath/files/Santhigiri/Music
